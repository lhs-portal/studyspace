<h1 id="note-title">What is a Drug?</h1>
<p class="c36 c33"><span class="c37"></span></p><ul class="c9 lst-kix_list_1-3 start"><li class="c24 li-bullet-1"><h6 style="display:inline" id="section-1"><span class="c13 c39">A drug is </span><span class="c13">any substance taken into the body that modifies or affects chemical reactions in the body</span></h6></li><li class="c51 li-bullet-2"><span class="c2">Some drugs are medicinal drugs that are used to treat the symptoms or causes of a disease - for example, </span><span class="c0">antibiotics</span></li></ul><ul class="c9 lst-kix_list_1-4 start"><li class="c22 li-bullet-2"><span class="c2">The </span><span class="c0">liver </span><span class="c2">is the primary site for drug metabolism</span></li></ul><p class="c8 c33"><span class="c6"></span></p>
