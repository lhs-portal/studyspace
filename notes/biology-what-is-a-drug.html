<h1 id="note-title">What is a Drug?</h1>
<p class="c9"><span class="c23"></span></p><ul class="c0 lst-kix_list_1-3 start"><li class="c31 li-bullet-1"><h6 style="display:inline" id="section-1"><span class="c35 c47">A drug is </span><span class="c35">any substance taken into the body that modifies or affects chemical reactions in the body</span></h6></li><li class="c42 li-bullet-2"><span class="c3">Some drugs are medicinal drugs that are used to treat the symptoms or causes of a disease - for example, </span><span class="c4">antibiotics</span></li></ul><ul class="c0 lst-kix_list_1-4 start"><li class="c30 li-bullet-2"><span class="c3">The </span><span class="c4">liver </span><span class="c3">is the primary site for drug metabolism</span></li></ul><p class="c11 c38"><span class="c7"></span></p>
