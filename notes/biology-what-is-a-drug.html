<h1 id="note-title">What is a Drug?</h1>
<p class="c8"><span class="c34"></span></p><ul class="c13 lst-kix_list_1-3 start"><li class="c32 li-bullet-1"><h6 style="display:inline" id="section-1"><span class="c31 c33">A drug is </span><span class="c31">any substance taken into the body that modifies or affects chemical reactions in the body</span></h6></li><li class="c42 li-bullet-2"><span class="c0">Some drugs are medicinal drugs that are used to treat the symptoms or causes of a disease - for example, </span><span class="c19">antibiotics</span></li></ul><ul class="c13 lst-kix_list_1-4 start"><li class="c40 li-bullet-2"><span class="c0">The </span><span class="c19">liver </span><span class="c0">is the primary site for drug metabolism</span></li></ul><p class="c15"><span class="c6"></span></p>
