  <h2>4.2.4 Definition of fiscal policy</h2>
</div>
<div class="note-body">
  <li>Fiscal policy refers to the decisions made by the government regarding taxation and public spending to influence total demand and economic activity and achieve macroeconomic aims.</li>
</div>
